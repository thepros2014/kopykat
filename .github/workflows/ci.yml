name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio pytest-cov httpx

      - name: Lint with Flake8
        run: |
          flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 server --count --exit-zero --max-complexity=15 --max-line-length=180 --statistics

      - name: Run Test Suite
        env:
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-12345"
          INTEGRATION_ENCRYPTION_KEY: "dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwMTI="
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest tests/ -v
