name: KopyKat CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit black

      - name: Check Python Syntax (compileall)
        run: python -m compileall server

      - name: Flake8 Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 server --count --exit-zero --max-complexity=15 --max-line-length=160 --statistics

      - name: Bandit Security Scan
        run: |
          bandit -r server -ll --exclude "/tests" -f custom --msg-template "{abspath}:{line}: {test_id}[bandit]: {msg}" || true

  test:
    needs: lint-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx

      - name: Run Full Pytest Suite
        env:
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-12345"
          INTEGRATION_ENCRYPTION_KEY: "dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwMTI="
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest -v
