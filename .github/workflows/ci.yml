name: Institutional CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bugbear

      - name: Critical Syntax & Undefined Symbol Analysis
        run: |
          flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Code Style & Complexity Checks
        run: |
          flake8 server --count --exit-zero --max-complexity=18 --max-line-length=180 --statistics

  security-scans:
    name: Security & Invariant Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Zero-Emoji Invariant Verification
        run: |
          python tests/test_no_emojis.py

      - name: Bandit Security AST Analysis
        run: |
          bandit -r server/ -ll -ii --exclude server/tests,server/__pycache__

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit -r requirements.txt

  test-suite:
    name: Automated Pytest Matrix & Coverage
    needs: [lint-and-validate, security-scans]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Execute Full Test Suite (Tiers 1-5)
        env:
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-12345"
          INTEGRATION_ENCRYPTION_KEY: "dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkwMTI="
          DATABASE_URL: "sqlite:///:memory:"
          TESTING: "true"
        run: |
          python -m pytest tests/ -v --cov=server --cov-report=term-missing --cov-report=xml

      - name: Verify 100% Test Pass Rate
        run: |
          echo "All automated test gates passed successfully."

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/react-app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/react-app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Frontend Dependency Audit
        working-directory: frontend/react-app
        run: npm audit --audit-level=high

      - name: Build Frontend
        working-directory: frontend/react-app
        run: npm run build
