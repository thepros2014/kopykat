# KopyKat Render deployment configuration
services:
  - type: web
    name: kopykat
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "uvicorn server.main:app --host 0.0.0.0 --port ${PORT:-10000} --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
